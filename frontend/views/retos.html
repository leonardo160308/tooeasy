<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retos - TOO-EASY</title>
    <link rel="icon" type="image/x-icon" href="../public/img/favicon.png">
    <link rel="stylesheet" href="../public/css/retos.css">
    <link rel="stylesheet" href="../public/css/header.css">
    <link rel="stylesheet" href="../public/css/alerts.css">
    <!-- ✅ NUEVO: Sistema de tooltips -->
    <link rel="stylesheet" href="../public/css/tooltips.css">
    <link rel="stylesheet" href="/public/css/vendor/fontawesome/all.min.css">
    <link rel="stylesheet" href="/public/css/vendor/fonts/fonts.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <h1>TOO-EASY</h1>
        <p>JUEGA HOY, TRIUNFA MAÑANA</p>
    </div>

    <nav class="nav">
        <a href="/dashboard.html">DASHBOARD</a>
        <a href="/inversiones.html">INVERSIONES</a>
        <a href="/retos.html">RETOS</a>
        <a href="/lecciones.html">LECCIONES</a>
        <a href="/perfil.html">PERFIL</a>
        <a href="#" id="logout-btn-perfil" title="Cerrar Sesión">
            <img src="../public/img/Salida.png" alt="Salir">
        </a>
    </nav>
</header>

<script type="module" src="/public/js/modules/nav-init.js"></script>

<div class="split-layout">
    
    <div class="left-panel">

        <!-- ══════════════════════════════════════════
             BANNER "¿CÓMO FUNCIONAN LOS RETOS?"
             Siempre visible, explica el sistema.


      ══════════════════════════════════════════
             TARJETA DE ESTADÍSTICAS (TÍTULO + MADERA)
        ═══════════════════════════════════════════ -->
        <div class="top-stats-card">

            <h2 class="tooltip-heading retos-title">
                RETOS
                <span class="tooltip-icon tt-right tt-wide"
                      data-tooltip="Los retos son desafíos financieros que se completan al registrar ciertos movimientos en el Dashboard. Cada reto completado te da Madera , el recurso para mejorar tu casa en la sección de Perfil.">ℹ</span>
            </h2>

            <div class="stats-bar">
                <div class="stat-item">
                    <img src="../public/img/madera.png" alt="Madera"
                         title="Madera — recurso de recompensa">
                    <div class="stat-label-col">
                        <span class="stat-label">Madera</span>
                        <span id="wood-count" class="wood-count-val">0</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- ══════════════════════════════════════════
             CONTENEDOR DE RETOS
        ═══════════════════════════════════════════ -->
        <div class="challenges-list-container">

            <div class="challenges-list-header">
                <span class="challenges-list-label">Tu progreso actual</span>
                <span class="challenges-list-hint">Haz clic en 'Reclamar' para cobrar tu recompensa</span>
            </div>

            <div id="challenges-container">
                <!-- Generado dinámicamente por challenges.js -->
            </div>

        </div>
    </div>

    <!-- Panel derecho: imagen decorativa -->
    <div class="right-panel-image"></div>

</div>

<script type="module" src="../public/js/pages/challenges.js"></script>
</body>
</html>
