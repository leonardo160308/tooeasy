<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - TooEasy</title>
    <link rel="icon" type="image/x-icon" href="../public/img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../public/css/crearcuenta.css">
    <link rel="stylesheet" href="../public/css/alerts.css">
    <link rel="stylesheet" href="/public/css/vendor/fontawesome/all.min.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    <div class="container">
        <form id="loginForm">
            <h1>Iniciar Sesión</h1>
            <p class="login-tagline">Juega hoy, triunfa mañana.</p>

            <label for="login-email">Correo electrónico</label>
            <input type="email" id="login-email" maxlength="254" placeholder="tu@correo.com" autocomplete="email" required>

            <label for="login-password">Contraseña</label>
            <div class="password-wrapper">
                <input type="password" id="login-password" minlength="8" maxlength="64" placeholder="Contraseña" autocomplete="current-password" required>
                <span class="toggle-pass" id="toggle-login-pass">
                    <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </span>
            </div>

            <div class="turnstile-wrapper">
                <div class="cf-turnstile"
                     data-sitekey="0x4AAAAAADi6aHI9gnxvvf4C"
                     data-theme="light"
                     data-language="es">
                </div>
            </div>

            <button type="submit">Iniciar sesión</button>

            <p id="auth-message"></p>
        </form>
        <a href="recuperar-cuenta.html" class="login-link">¿Olvidaste tu contraseña?</a>
        <a href="registro.html" class="login-link">¿No tienes cuenta? Regístrate aquí</a>
    </div>
    <div class="footer-navigation">
        <a href="./index.html" class="btn-back">Regresar</a>
    </div>
    <script type="module" src="../public/js/pages/auth.js"></script>
</body>
</html>
