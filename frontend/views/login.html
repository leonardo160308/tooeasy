<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - TooEasy</title>
    <link rel="icon" type="image/x-icon" href="../public/img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ✅ RUTA CORREGIDA -->
    <link rel="stylesheet" href="../public/css/crearcuenta.css">
    <link rel="stylesheet" href="../public/css/alerts.css">
</head>
<body>
    <div class="container">
        <!-- ✅ ID REQUERIDO: loginForm -->
        <form id="loginForm"> 
            <h1>Iniciar Sesión</h1>
            <p class="login-tagline">Juega hoy, triunfa mañana.</p>
            
            <label for="Nombre">Usuario</label>
            <!-- ✅ ID REQUERIDO: Nombre -->
            <input type="text" id="Nombre" minlength="3" maxlength="16" placeholder="Usuario" required> 
            
            <label for="contraseña">Contraseña</label>
            <!-- ✅ ID REQUERIDO: contraseña -->
            <input type="password" id="contraseña" minlength="6" maxlength="16" placeholder="Contraseña" required> 
            
            <button type="submit">Iniciar</button>
            
            <!-- Mensaje de error/éxito -->
            <p id="auth-message"></p>
        </form>
        <a href="recuperar-cuenta.html" class="login-link">¿Olvidaste tu contraseña?</a>
        <a href="registro.html" class="login-link">¿No tienes cuenta? Regístrate aquí</a>
        
    </div>
 <div class="footer-navigation">
            <a href="./index.html" class="btn-back">Regresar</a>
        </div>
    <!-- ✅ RUTA CORREGIDA -->
    <script type="module" src="../public/js/pages/auth.js"></script>
</body>
</html>
