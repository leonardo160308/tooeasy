<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - TOO-EASY</title>
    <link rel="icon" type="image/x-icon" href="../public/img/favicon.png">

    <link rel="stylesheet" href="../public/css/preguntas.css">
    <link rel="stylesheet" href="../public/css/alerts.css">
    
</head>
<body>

<!-- ============================================================
     LAYOUT: imagen izquierda | quiz derecha
============================================================ -->
<div class="contenedor-quiz">

    <!-- IZQUIERDA: Ilustración decorativa -->
    <div class="lado-izquierdo">
        <img id="imagenPregunta"
             src=""
             alt="Ilustración de la pregunta">
    </div>

    <!-- DERECHA: Zona del quiz -->
    <div class="lado-derecho">

        <!-- HEADER -->
        <div class="quiz-header">
            <div class="quiz-meta">
                <h2>Nivel <span id="nivel-actual">1</span></h2>
                <p>Pregunta <span id="pregunta-actual">1</span> de <span id="total-preguntas">5</span></p>
            </div>
            <div class="contador" id="contador-label">1 / 5</div>
        </div>

        <!-- BARRA DE PROGRESO -->
        <div class="progreso-container">
            <div class="progreso" id="barra-progreso"></div>
        </div>

        <!-- TARJETA DE PREGUNTA -->
        <div class="pregunta-section" id="pregunta-card">
            <span class="q-deco" aria-hidden="true">?</span>
            <h3 id="textoPregunta">Cargando pregunta...</h3>
        </div>

        <!-- OPCIONES (generadas por JS) -->
        <div class="opciones" id="opcionesContainer"></div>

        <!-- BOTÓN COMPROBAR -->
        <button class="boton-comprobar hidden" id="botonComprobar">
            Comprobar respuesta
        </button>

        <!-- PANEL FEEDBACK — wrapper con animación de altura -->
        <div class="resultado-wrapper" id="resultadoWrapper">
            <div class="resultado" id="resultado">
                <div class="resultado-txt">
                    <span class="ico" id="resultado-ico"></span>
                    <span id="resultado-msg"></span>
                </div>
                <button id="btn-next">Siguiente →</button>
            </div>
        </div>

    </div><!-- fin .lado-derecho -->
</div><!-- fin .contenedor-quiz -->

<!-- MODAL FINAL -->
<div id="modal-final" class="modal-final">
    <div class="modal-content-final" id="modal-body">
        <!-- Generado por JS -->
    </div>
</div>

<script type="module" src="../public/js/pages/quiz.js"></script>
</body>
</html>
