<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecciones - TOO-EASY</title>
    <link rel="icon" type="image/x-icon" href="../public/img/Imagen1.png">

    <link rel="stylesheet" href="../public/css/lecciones.css">
    <link rel="stylesheet" href="../public/css/header.css">
    <link rel="stylesheet" href="../public/css/alerts.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
    <div class="logo">
        <h1>TOO-EASY</h1>
        <p>JUEGA HOY, TRIUNFA MAÑANA</p>
    </div>
    <nav class="nav">
        <a href="/dashboard.html">DASHBOARD</a>
        <a href="/inversiones.html">INVERSIONES</a>
        <a href="/retos.html">RETOS</a>
        <a href="/lecciones.html">LECCIONES</a>
        <a href="/perfil.html">PERFIL</a>
        <a href="#" id="logout-btn-perfil" title="Cerrar Sesión">
            <img src="../public/img/Salida.png" alt="Salir">
        </a>
    </nav>
</header>

<script type="module">
    import { logout, isAdmin } from '/public/js/modules/auth.js';
    import { alertaConfirmacion } from '/public/js/modules/alerts.js';
    import '/public/js/modules/nav-active.js';

    if (isAdmin()) {
        const nav = document.querySelector('.nav');
        const adminLink = document.createElement('a');
        adminLink.href = '/admin.html';
        adminLink.textContent = 'ADMIN';
        adminLink.style.color = '#f39c12';
        nav.insertBefore(adminLink, nav.children[nav.children.length - 1]);
    }

    const logoutBtn = document.getElementById('logout-btn-perfil');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            const confirmar = await alertaConfirmacion(
                '¿Estás seguro de que deseas cerrar sesión?',
                '👋 Salir de TOO-EASY'
            );
            if (confirmar) logout();
        });
    }
</script>

<main>
    <section class="container pagina-principal">
        <div class="contenido-principal">
            <h2>Tu Camino hacia la Libertad Financiera</h2>
            <p>
                Selecciona una categoría para ver tus niveles. Cada lección desbloqueada
                te acerca más a dominar tus finanzas personales.
            </p>
        </div>
        <div class="imagen-principal">
            <img src="../public/img/Imagen2.png" alt="Educación Financiera">
        </div>
    </section>

    <div class="loading-levels" style="text-align:center;margin:2rem 0;">
        <i class="fas fa-spinner fa-spin"></i> Cargando progreso...
    </div>

    <section class="container categorias-info" style="margin-top:2rem;">
        <h2 style="text-align:center;font-family:'Baloo 2',cursive;font-size:32px;margin-bottom:2rem;color:#2C405B;">
            Categorías de Aprendizaje
        </h2>
        <!-- Las tarjetas se generan dinámicamente por lessons.js -->
        <div class="tarjetas"></div>
    </section>
</main>

<script type="module" src="../public/js/pages/lessons.js"></script>
<script type="module" src="/public/js/modules/nav-active.js"></script>

</body>
</html>
