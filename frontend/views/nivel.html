<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lección - TOO-EASY</title>
    <link rel="icon" type="image/x-icon" href="../public/img/favicon.png">
    <!-- ✅ CSS CORREGIDOS -->
    <link rel="stylesheet" href="../public/css/flashcards.css">
    <link rel="stylesheet" href="../public/css/header.css">
    <link rel="stylesheet" href="../public/css/alerts.css">

    <!-- Font Awesome y Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ========================================
     ENCABEZADO CON NAVEGACIÓN
     ======================================== -->
<header class="header">
    <div class="logo">
        <h1>TOO-EASY</h1>
        <p>JUEGA HOY, TRIUNFA MAÑANA</p>
    </div>

    <nav class="nav">
        <a href="/dashboard.html">DASHBOARD</a>
        <a href="/inversiones.html">INVERSIONES</a>
        <a href="/retos.html">RETOS</a>
        <a href="/lecciones.html">LECCIONES</a>
        <a href="/perfil.html">PERFIL</a>
        <!-- ✅ BOTÓN DE SALIR CON ID ESPECÍFICO -->
        <a href="#" id="logout-btn-perfil" title="Cerrar Sesión">
            <img src="../public/img/Salida.png" alt="Salir">
        </a>
    </nav>
</header>

<!-- ========================================
     SCRIPT PARA EL BOTÓN DE SALIR
     Añade esto DESPUÉS de tu <script type="module" src="...profile.js">
     ======================================== -->

<script type="module">
    import { logout, isAdmin } from '/public/js/modules/auth.js';
    import { alertaConfirmacion } from '/public/js/modules/alerts.js';
    
    // ✅ MOSTRAR ENLACE ADMIN SI ES ADMIN
    if (isAdmin()) {
        const nav = document.querySelector('.nav');
        const adminLink = document.createElement('a');
        adminLink.href = '/admin.html';
        adminLink.textContent = 'ADMIN';
        adminLink.style.color = '#f39c12'; // Color diferente para destacar
        nav.insertBefore(adminLink, nav.children[nav.children.length - 1]);
    }
    
    const logoutBtn = document.getElementById('logout-btn-perfil');
    
    if (logoutBtn) {
        logoutBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            const confirmar = await alertaConfirmacion(
                '¿Estás seguro de que deseas cerrar sesión?',
                '👋 Salir de TOO-EASY'
            );
            if (confirmar) logout();
        });
    }
</script>

<!-- ========================================
     CONTENEDOR PRINCIPAL DE FLASHCARDS
     ======================================== -->
     <main class="main-content">
<div class="container">

    <!-- ========================================
         HEADER: INFORMACIÓN DEL NIVEL
         ======================================== -->
    <div class="lesson-header" style="text-align: center; margin-bottom: 30px;">
        <h1 id="lesson-title" style="color: #fff;background-color: #BA8E58; margin-bottom: 10px; padding: 10px;">
             Cargando lección...
        </h1>
        <p id="lesson-subtitle" style="color: #666; font-size: 1.1rem;">
            <!-- Ej: "Tema: Fundamentos - Nivel 1" -->
        </p>
    </div>

    <!-- ========================================
         TARJETA FLASHCARD (SE VOLTEA)
         ======================================== -->
    <div class="card" id="flashcard">
        <div class="card-inner">
            
            <!-- FRENTE DE LA TARJETA -->
            <div class="card-front">
                <h2 class="card-title" id="card-title-front">
                    Título de la Lección
                </h2>
                <img id="card-image" src="../public/img/Imagen1.1.png" alt="Ilustración">
            </div>

            <!-- REVERSO DE LA TARJETA -->
            <div class="card-back">
                <h2 class="title-back" id="card-title-back">
                    Título de la Lección
                </h2>
                <div class="container-info">
                    <p class="card-text" id="card-content">
                        Contenido educativo aquí...
                    </p>
                </div>
            </div>

        </div>
    </div>

    <!-- ========================================
         CONTROLES DE NAVEGACIÓN
         ======================================== -->
    
    <!-- Flechas para cambiar de tarjeta -->
    <button class="arrow-btn" id="prevCard" style="display: none;">
        ◄
    </button>
    <button class="arrow-btn" id="nextCard" style="display: none;">
        ►
    </button>

    <!-- Indicador de progreso -->
    <div style="text-align: center; margin-top: 20px;">
        <span id="card-counter" style="font-size: 1.1rem; color: #666;">
            <!-- Ej: "Tarjeta 1 de 5" -->
        </span>
    </div>

    <!-- ========================================
         BOTONES DE ACCIÓN
         ======================================== -->
    <div class="buttons">
        <a href="lecciones.html">
            <button class="btn-secondary">
                ← Volver a Niveles
            </button>
        </a>
        
        <button id="btn-ir-quiz" class="btn-primary">
            Hacer Quiz →
        </button>
    </div>

</div>
</main>
<!-- ========================================
     SCRIPT PARA LAS FLASHCARDS
     ======================================== -->

<script type="module" src="../public/js/pages/nivel-db.js"></script>
</body>
</html>
