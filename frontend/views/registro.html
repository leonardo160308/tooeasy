<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - TooEasy</title>
    <link rel="icon" type="image/x-icon" href="../public/img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../public/css/alerts.css">
    <link rel="stylesheet" href="../public/css/terminos.css">
    <link rel="stylesheet" href="../public/css/iniciarsesion.css">
</head>
<body>
    <div class="auth-container">
        <form id="registerForm">

            <div class="avatar-header">
                <img src="../public/img/avatars/perfil1.png" alt="Avatar" class="avatar-img">
            </div>

            <h2>Crear Cuenta</h2>
            <p class="subtitle">¡Completa tu perfil para empezar!</p>

            <div class="field">
                <input type="text" id="registerNombre"
                       minlength="3" maxlength="16"
                       placeholder="Nombre de usuario" required>
            </div>

            <div class="field">
                <input type="email" id="registerEmail"
                       minlength="6" maxlength="254"
                       placeholder="Correo electrónico" required>
            </div>

            <div class="field password-wrapper">
                <input type="password" id="registerContraseña"
                       minlength="6" maxlength="16"
                       placeholder="Contraseña (6–16 caracteres)" required>
                <span class="toggle-pass" id="toggle-reg-pass">
                    <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </span>
            </div>

            <div class="row-fields">
                <input type="number" id="registerEdad"
                       placeholder="Edad" min="15" max="99" required>

                <select id="registerGenero" required>
                    <option value="" disabled selected>Género</option>
                    <option value="femenino">Femenino</option>
                    <option value="masculino">Masculino</option>
                    <option value="otro">Otro</option>
                    <option value="no-decir">Prefiero no decir</option>
                </select>
            </div>

            <div class="terms-group">
                <input type="checkbox" id="terminos" required>
                <label for="terminos">
                    Acepto los <span>Términos y Condiciones</span>
                </label>
            </div>

            <button type="submit" class="btn-primary">Crear cuenta</button>

            <p class="login-ask">
                ¿Ya tienes cuenta?
                <a href="login.html" class="login">Iniciar sesión</a>
            </p>

        </form>
    </div>

    <div class="footer-navigation">
        <a href="./index.html" class="btn-back">← Regresar</a>
    </div>

    <script type="module" src="/public/js/pages/auth.js"></script>
    <script src="../public/js/data/terminos.js"></script>
</body>
</html>
